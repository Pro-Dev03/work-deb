services:
  - type: web
    name: work-dev-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://worker-0dev.onrender.com,https://work-dev.onrender.com"
      - key: DEFAULT_LANG
        value: ar
      - key: GEOAPIFY_KEY
        value: 6d3d2681365646f68b4ab8e2cd85038f
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: REDIS_URL
        value: redis://red-d9rbebqjnfac73fb1700:6379

  - type: web
    name: work-dev
    runtime: static
    plan: free
    rootDir: frontend-admin-dashboard
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeployTrigger: commit
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: ELECTRON
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://work-dev-api.onrender.com/api/v1

  - type: web
    name: worker-0dev
    runtime: static
    plan: free
    rootDir: frontend-worker-pwa
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeployTrigger: commit
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: ELECTRON
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://work-dev-api.onrender.com/api/v1
