services:
  - type: web
    name: worktrack-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://worktrack-admin.onrender.com,https://worktrack-client-portal.onrender.com,https://worktrack-worker.onrender.com,https://worktrack-worker-pwa.onrender.com,https://worktrack-client.onrender.com"
      - key: DEFAULT_LANG
        value: ar
      - key: GEOAPIFY_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  - type: web
    name: worktrack-admin
    runtime: static
    plan: free
    rootDir: frontend-admin-dashboard
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Expires
        value: 0
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: ELECTRON
        value: "false"

  - type: web
    name: worktrack-worker
    runtime: static
    plan: free
    rootDir: frontend-worker-pwa
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Expires
        value: 0
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: ELECTRON
        value: "false"

  - type: web
    name: worktrack-client-portal
    runtime: static
    plan: free
    rootDir: frontend-client-portal
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Expires
        value: 0
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: ELECTRON
        value: "false"
