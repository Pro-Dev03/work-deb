<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="icon" type="image/jpeg" href="/company-logo.jpg" sizes="512x512" />
    <link rel="apple-touch-icon" href="/company-logo.jpg" sizes="512x512" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>WorkTrack — Admin</title>
    <style>
      /* منع ظهور المحتوى غير المنسق - Critical CSS */
      html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* إخفاء العناصر غير الضرورية قبل التحميل */
      body > :not(#app):not(script) {
        display: none !important;
      }
      
      /* إخفاء Vue app قبل التحميل */
      [v-cloak] {
        display: none !important;
      }
      
      /* شاشة التحميل */
      #app[v-cloak] {
        display: flex !important;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        position: relative;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      
      #app[v-cloak]::before {
        content: "جاري التحميل...";
        font-size: 18px;
        color: #64748b;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="app" v-cloak></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
